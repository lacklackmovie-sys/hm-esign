name: Deploy GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Restore assets (pdf.js cmaps/fonts/wasm, app icons)
        run: bash scripts/restore-assets.sh
      - run: npm test
      - run: npm run build && touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
      - name: Enable GitHub Pages (gh-pages branch) if not enabled yet
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pages >/dev/null 2>&1 \
          || gh api -X POST repos/${{ github.repository }}/pages -f 'source[branch]=gh-pages' -f 'source[path]=/'
